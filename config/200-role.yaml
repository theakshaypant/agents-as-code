---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-as-code-controller
  namespace: agents-as-code-system
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-as-code-webhook
  namespace: agents-as-code-system
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agents-as-code-controller-clusterrole
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
rules:
  - apiGroups: ["agent.tekton.dev"]
    resources: ["repositories"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["agent.tekton.dev"]
    resources: ["repositories/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["agent.tekton.dev"]
    resources: ["agentruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["agent.tekton.dev"]
    resources: ["agentruns/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agents-as-code-controller-clusterbinding
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
subjects:
  - kind: ServiceAccount
    name: agents-as-code-controller
    namespace: agents-as-code-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agents-as-code-controller-clusterrole
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agents-as-code-webhook-clusterrole
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
rules:
  - apiGroups: ["agent.tekton.dev"]
    resources: ["repositories"]
    verbs: ["get", "list"]
  - apiGroups: ["agent.tekton.dev"]
    resources: ["agentruns"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agents-as-code-webhook-clusterbinding
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
subjects:
  - kind: ServiceAccount
    name: agents-as-code-webhook
    namespace: agents-as-code-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agents-as-code-webhook-clusterrole
