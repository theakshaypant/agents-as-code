---
apiVersion: v1
kind: Service
metadata:
  name: yeet-webhook
  namespace: yeet-system
  labels:
    app: yeet-webhook
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/part-of: yeet
spec:
  ports:
    - name: http-listener
      port: 8080
      protocol: TCP
      targetPort: 8082
  selector:
    app.kubernetes.io/name: webhook
    app.kubernetes.io/component: webhook
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: yeet
