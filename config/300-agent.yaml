apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.agent.tekton.dev
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
spec:
  group: agent.tekton.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
      - agt
    singular: agent
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.system_prompt
          name: SystemPrompt
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Agent is a user-defined agent template describing what the agent does,
            which git events trigger it, and which tools it uses.
            Agent definitions live in .tekton/agents/ in the repository and are
            discovered by the controller on each git event.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                limits:
                  description: |-
                    Limits constrains agent execution.
                    Bounded by Repository settings — agent can set lower, not higher.
                  properties:
                    max_tokens:
                      description: MaxTokens is the maximum tokens per AgentRun.
                      minimum: 1
                      type: integer
                    timeout_seconds:
                      description: TimeoutSeconds is the maximum execution time.
                      minimum: 1
                      type: integer
                  required:
                    - max_tokens
                    - timeout_seconds
                  type: object
                system_prompt:
                  description: SystemPrompt is the agent's core identity and behavioral instructions.
                  type: string
                tools:
                  description: |-
                    Tools selects which MCP servers (from the Repository catalog) to use
                    and which specific tools to enable.
                  properties:
                    allowed:
                      description: |-
                        Allowed is an allowlist of specific tools.
                        Format: "server:tool" or "server:*".
                        If empty, all tools from selected servers are available.
                      items:
                        type: string
                      type: array
                    mcp_servers:
                      description: MCPServers references MCP servers by name from the Repository catalog.
                      items:
                        type: string
                      type: array
                  type: object
              required:
                - limits
                - system_prompt
              type: object
          required:
            - metadata
            - spec
          type: object
      served: true
      storage: true
