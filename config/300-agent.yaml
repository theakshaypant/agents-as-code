apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.agent.tekton.dev
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
spec:
  group: agent.tekton.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
      - agt
    singular: agent
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.purpose
          name: Purpose
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Agent is a user-defined agent template describing what the agent does,
            which git events trigger it, and which LLM provider to use.
            Agent definitions live in .tekton/agents/ in the repository and are
            discovered by the controller on each git event.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                context:
                  properties:
                    depth:
                      description: Depth overrides the max hops from seed nodes.
                      type: integer
                    edgeFilter:
                      description: EdgeFilter limits which relationships to traverse.
                      items:
                        type: string
                      type: array
                    nodeFilter:
                      description: NodeFilter limits which node kinds to include.
                      items:
                        type: string
                      type: array
                    strategy:
                      description: Strategy overrides the inferred traversal strategy (bfs, dfs, community, impact).
                      type: string
                    tokenBudget:
                      description: TokenBudget caps the context size.
                      type: integer
                  type: object
                limits:
                  description: Limits constrains agent execution.
                  properties:
                    maxTokens:
                      description: MaxTokens is the maximum tokens per AgentRun.
                      minimum: 1
                      type: integer
                    timeoutSeconds:
                      description: TimeoutSeconds is the maximum execution time.
                      minimum: 1
                      type: integer
                  required:
                    - maxTokens
                    - timeoutSeconds
                  type: object
                purpose:
                  description: |-
                    Purpose is natural language describing what the agent does.
                    Drives automatic KG filtering strategy selection.
                  type: string
              required:
                - limits
                - purpose
              type: object
          required:
            - metadata
            - spec
          type: object
      served: true
      storage: true
