apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.agent.tekton.dev
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
spec:
  group: agent.tekton.dev
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
      - repo
    singular: repository
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.url
          name: URL
          type: string
        - jsonPath: .spec.knowledge_graph.enabled
          name: KG
          type: boolean
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Repository is the representation of a Git repository and its associated
            knowledge graph configuration.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                git_provider:
                  description: GitProvider contains authentication configuration for the Git provider.
                  properties:
                    secret:
                      description: Secret references the Kubernetes Secret containing the Git provider token.
                      properties:
                        key:
                          description: Key within the Secret.
                          type: string
                        name:
                          description: Name of the Kubernetes Secret.
                          type: string
                      required:
                        - name
                      type: object
                    webhook_secret:
                      description: |-
                        WebhookSecret references the Kubernetes Secret containing the webhook
                        shared secret for payload validation. Used for webhook/PAT auth.
                        For GitHub App auth, the webhook secret comes from the global
                        controller secret instead.
                      properties:
                        key:
                          description: Key within the Secret.
                          type: string
                        name:
                          description: Name of the Kubernetes Secret.
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - secret
                  type: object
                knowledge_graph:
                  description: KnowledgeGraph configures the repository's knowledge graph.
                  properties:
                    branches:
                      description: Branches defines per-branch KG configuration. Each branch gets its own PV.
                      items:
                        properties:
                          name:
                            description: Name of the branch. Supports glob patterns (e.g. "release-*").
                            minLength: 1
                            type: string
                          scope:
                            description: Scope limits which paths are included in the knowledge graph.
                            properties:
                              ignore:
                                description: Ignore excludes files matching these patterns, on top of graphify defaults.
                                items:
                                  type: string
                                type: array
                              paths:
                                description: Paths limits the graph to these directories.
                                items:
                                  type: string
                                type: array
                            type: object
                          storage:
                            anyOf:
                              - type: integer
                              - type: string
                            description: Storage is the size of the PV for this branch's knowledge graph.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        required:
                          - name
                        type: object
                      type: array
                    enabled:
                      description: Enabled controls whether the knowledge graph is maintained for this repository.
                      type: boolean
                    storageClassName:
                      description: StorageClassName is the StorageClass used for provisioning KG PersistentVolumes.
                      type: string
                  required:
                    - enabled
                  type: object
                settings:
                  description: Settings contains optional configuration for the repository.
                  properties:
                    ai:
                      description: AI configures the LLM provider used by agents for this repository.
                      properties:
                        base_url:
                          description: BaseURL overrides the LLM API endpoint for custom or self-hosted providers.
                          type: string
                        enabled:
                          description: Enabled controls whether AI agents can run against this repository.
                          type: boolean
                        max_cost_per_run:
                          description: |-
                            MaxCostPerRun is the per-run budget cap in USD (e.g. "1.50").
                            The controller terminates runs that exceed this amount.
                          pattern: ^[0-9]+(\.[0-9]+)?$
                          type: string
                        max_timeout_seconds:
                          description: |-
                            MaxTimeoutSeconds is the default execution timeout per run.
                            Agents can set lower timeouts but not higher.
                          minimum: 1
                          type: integer
                        max_tokens_per_run:
                          description: |-
                            MaxTokensPerRun is the default token limit per run.
                            Agents can set lower limits but not higher.
                          minimum: 1
                          type: integer
                        model:
                          description: Model overrides the default LLM model for this provider.
                          type: string
                        model_config:
                          description: ModelConfig holds model-specific tuning parameters.
                          properties:
                            max_context_tokens:
                              description: |-
                                MaxContextTokens limits the total context window usage.
                                The controller truncates instruction content to fit within this budget.
                              minimum: 1
                              type: integer
                            max_output_tokens:
                              description: MaxOutputTokens limits the length of each model response.
                              minimum: 1
                              type: integer
                            parameters:
                              additionalProperties:
                                type: string
                              description: |-
                                Parameters is a provider-specific key-value map for settings
                                not covered by the common fields (e.g. top_p, frequency_penalty).
                              type: object
                            temperature:
                              description: |-
                                Temperature controls randomness (0.0 = deterministic, 1.0+ = creative).
                                Serialized as a string to satisfy CRD schema constraints (e.g. "0.2").
                              type: string
                            thinking:
                              description: Thinking configures extended thinking / chain-of-thought.
                              properties:
                                budget_tokens:
                                  description: |-
                                    BudgetTokens is the max tokens the model can use for thinking.
                                    Maps to Claude's budget_tokens or OpenAI's max_completion_tokens for reasoning.
                                  minimum: 1
                                  type: integer
                                enabled:
                                  description: Enabled controls whether extended thinking is active.
                                  type: boolean
                              required:
                                - enabled
                              type: object
                          type: object
                        provider:
                          description: Provider is the LLM provider name (e.g. openai, anthropic, gemini).
                          type: string
                        secret_ref:
                          description: SecretRef references the Kubernetes Secret containing the LLM API key.
                          properties:
                            key:
                              description: Key within the Secret.
                              type: string
                            name:
                              description: Name of the Kubernetes Secret.
                              type: string
                          required:
                            - name
                          type: object
                      required:
                        - enabled
                        - provider
                        - secret_ref
                      type: object
                    mcp_servers:
                      description: |-
                        MCPServers declares the MCP servers available to agents in this repo.
                        Agents reference these by name in their tool configuration.
                      items:
                        properties:
                          args:
                            description: Args passed to the MCP server.
                            items:
                              type: string
                            type: array
                          command:
                            description: |-
                              Command is the command to launch the MCP server (stdio transport).
                              Mutually exclusive with Image.
                            items:
                              type: string
                            type: array
                          env:
                            description: Env are environment variables for the MCP server.
                            items:
                              properties:
                                name:
                                  description: Name of the environment variable.
                                  type: string
                                value:
                                  description: Value is a literal value.
                                  type: string
                                value_from:
                                  description: ValueFrom references a secret or configmap key.
                                  properties:
                                    config_map_key_ref:
                                      description: ConfigMapKeyRef selects a key from a ConfigMap.
                                      properties:
                                        key:
                                          description: Key within the Secret or ConfigMap.
                                          type: string
                                        name:
                                          description: Name of the Secret or ConfigMap.
                                          type: string
                                      required:
                                        - key
                                        - name
                                      type: object
                                    secret_key_ref:
                                      description: SecretKeyRef selects a key from a Secret.
                                      properties:
                                        key:
                                          description: Key within the Secret or ConfigMap.
                                          type: string
                                        name:
                                          description: Name of the Secret or ConfigMap.
                                          type: string
                                      required:
                                        - key
                                        - name
                                      type: object
                                  type: object
                              required:
                                - name
                              type: object
                            type: array
                          image:
                            description: |-
                              Image is a container image for the MCP server (sidecar model).
                              Mutually exclusive with Command.
                            type: string
                          name:
                            description: Name identifies this MCP server. Agents reference this name.
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      type: array
                    network:
                      description: Network configures network policy for agent sandboxes.
                      properties:
                        egress:
                          description: Egress allows specific outbound connections (used with "restricted").
                          items:
                            properties:
                              cidr:
                                description: CIDR is an IP range to allow (e.g. "10.0.0.0/8").
                                type: string
                              host:
                                description: Host is a DNS hostname to allow (e.g. "api.github.com").
                                type: string
                              ports:
                                description: Ports are the allowed destination ports.
                                items:
                                  type: integer
                                type: array
                            type: object
                          type: array
                        preset:
                          default: permissive
                          description: |-
                            Preset is the base network policy.
                            "restricted": deny all egress except the LLM provider endpoint
                              (resolved from AIConfig) and explicitly allowed hosts.
                            "permissive": allow all egress (default).
                            "air-gapped": no network access except the LLM provider endpoint.
                            The controller always injects an egress rule for the configured
                            AIConfig.BaseURL (or the provider's default API endpoint) so
                            the agent can reach the model regardless of preset.
                          enum:
                            - restricted
                            - permissive
                            - air-gapped
                          type: string
                      required:
                        - preset
                      type: object
                    runtime:
                      description: Runtime configures the sandbox environment for agent execution.
                      properties:
                        sandbox_template:
                          description: |-
                            SandboxTemplate is the name of the SandboxTemplate CR used to create
                            agent execution environments. The template defines the container image,
                            resource limits, and base configuration for sandboxes.
                          type: string
                        service_account_name:
                          description: ServiceAccountName is the K8s service account for sandbox Pods.
                          type: string
                      required:
                        - sandbox_template
                      type: object
                  type: object
                url:
                  description: URL of the Git repository.
                  pattern: ^https?://
                  type: string
              required:
                - url
              type: object
            status:
              properties:
                knowledge_graph:
                  description: KnowledgeGraph tracks the status of the knowledge graph per branch.
                  properties:
                    branches:
                      description: Branches contains per-branch KG status.
                      items:
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: |-
                              Annotations is additional Status fields for the Resource to save some
                              additional State as well as convey more information to the user. This is
                              roughly akin to Annotations on any k8s resource, just the reconciler conveying
                              richer information outwards.
                            type: object
                          communityCount:
                            description: CommunityCount is the number of detected communities.
                            type: integer
                          conditions:
                            description: Conditions the latest available observations of a resource's current state.
                            items:
                              description: |-
                                Condition defines a readiness condition for a Knative resource.
                                See: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#typical-status-properties
                              properties:
                                lastTransitionTime:
                                  description: |-
                                    LastTransitionTime is the last time the condition transitioned from one status to another.
                                    We use VolatileTime in place of metav1.Time to exclude this from creating equality.Semantic
                                    differences (all other things held constant).
                                  type: string
                                message:
                                  description: A human readable message indicating details about the transition.
                                  type: string
                                reason:
                                  description: The reason for the condition's last transition.
                                  type: string
                                severity:
                                  description: |-
                                    Severity with which to treat failures of this type of condition.
                                    When this is not specified, it defaults to Error.
                                  type: string
                                status:
                                  description: Status of the condition, one of True, False, Unknown.
                                  type: string
                                type:
                                  description: Type of condition.
                                  type: string
                              required:
                                - status
                                - type
                              type: object
                            type: array
                          edgeCount:
                            description: EdgeCount is the number of edges in the graph.
                            type: integer
                          lastCommitSHA:
                            description: LastCommitSHA is the commit SHA the KG was last built from.
                            type: string
                          lastUpdated:
                            description: LastUpdated is the last time the KG was updated.
                            format: date-time
                            type: string
                          name:
                            description: Name of the branch.
                            type: string
                          nodeCount:
                            description: NodeCount is the number of nodes in the graph.
                            type: integer
                          observedGeneration:
                            description: |-
                              ObservedGeneration is the 'Generation' of the Service that
                              was last processed by the controller.
                            format: int64
                            type: integer
                        required:
                          - name
                        type: object
                      type: array
                  type: object
              type: object
          required:
            - metadata
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
