apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.agent.tekton.dev
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
spec:
  group: agent.tekton.dev
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
      - repo
    singular: repository
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.url
          name: URL
          type: string
        - jsonPath: .spec.knowledge_graph.enabled
          name: KG
          type: boolean
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Repository is the representation of a Git repository and its associated
            knowledge graph configuration.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                git_provider:
                  description: GitProvider contains authentication configuration for the Git provider.
                  properties:
                    secret:
                      description: Secret references the Kubernetes Secret containing the Git provider token.
                      properties:
                        key:
                          description: Key within the Secret.
                          type: string
                        name:
                          description: Name of the Kubernetes Secret.
                          type: string
                      required:
                        - name
                      type: object
                    webhook_secret:
                      description: |-
                        WebhookSecret references the Kubernetes Secret containing the webhook
                        shared secret for payload validation. Used for webhook/PAT auth.
                        For GitHub App auth, the webhook secret comes from the global
                        controller secret instead.
                      properties:
                        key:
                          description: Key within the Secret.
                          type: string
                        name:
                          description: Name of the Kubernetes Secret.
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - secret
                  type: object
                knowledge_graph:
                  description: KnowledgeGraph configures the repository's knowledge graph.
                  properties:
                    branches:
                      description: Branches defines per-branch KG configuration. Each branch gets its own PV.
                      items:
                        properties:
                          name:
                            description: Name of the branch. Supports glob patterns (e.g. "release-*").
                            minLength: 1
                            type: string
                          scope:
                            description: Scope limits which paths are included in the knowledge graph.
                            properties:
                              ignore:
                                description: Ignore excludes files matching these patterns, on top of graphify defaults.
                                items:
                                  type: string
                                type: array
                              paths:
                                description: Paths limits the graph to these directories.
                                items:
                                  type: string
                                type: array
                            type: object
                          storage:
                            anyOf:
                              - type: integer
                              - type: string
                            description: Storage is the size of the PV for this branch's knowledge graph.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        required:
                          - name
                        type: object
                      type: array
                    enabled:
                      description: Enabled controls whether the knowledge graph is maintained for this repository.
                      type: boolean
                    storageClassName:
                      description: StorageClassName is the StorageClass used for provisioning KG PersistentVolumes.
                      type: string
                  required:
                    - enabled
                  type: object
                settings:
                  description: Settings contains optional configuration for the repository.
                  properties:
                    ai:
                      description: AI configures the LLM provider used by agents for this repository.
                      properties:
                        enabled:
                          description: Enabled controls whether AI agents can run against this repository.
                          type: boolean
                        provider:
                          description: Provider is the LLM provider name (e.g. openai, anthropic).
                          type: string
                        secret_ref:
                          description: SecretRef references the Kubernetes Secret containing the LLM API key.
                          properties:
                            key:
                              description: Key within the Secret.
                              type: string
                            name:
                              description: Name of the Kubernetes Secret.
                              type: string
                          required:
                            - name
                          type: object
                      required:
                        - enabled
                        - provider
                        - secret_ref
                      type: object
                  type: object
                url:
                  description: URL of the Git repository.
                  pattern: ^https?://
                  type: string
              required:
                - url
              type: object
            status:
              properties:
                knowledge_graph:
                  description: KnowledgeGraph tracks the status of the knowledge graph per branch.
                  properties:
                    branches:
                      description: Branches contains per-branch KG status.
                      items:
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: |-
                              Annotations is additional Status fields for the Resource to save some
                              additional State as well as convey more information to the user. This is
                              roughly akin to Annotations on any k8s resource, just the reconciler conveying
                              richer information outwards.
                            type: object
                          communityCount:
                            description: CommunityCount is the number of detected communities.
                            type: integer
                          conditions:
                            description: Conditions the latest available observations of a resource's current state.
                            items:
                              description: |-
                                Condition defines a readiness condition for a Knative resource.
                                See: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#typical-status-properties
                              properties:
                                lastTransitionTime:
                                  description: |-
                                    LastTransitionTime is the last time the condition transitioned from one status to another.
                                    We use VolatileTime in place of metav1.Time to exclude this from creating equality.Semantic
                                    differences (all other things held constant).
                                  type: string
                                message:
                                  description: A human readable message indicating details about the transition.
                                  type: string
                                reason:
                                  description: The reason for the condition's last transition.
                                  type: string
                                severity:
                                  description: |-
                                    Severity with which to treat failures of this type of condition.
                                    When this is not specified, it defaults to Error.
                                  type: string
                                status:
                                  description: Status of the condition, one of True, False, Unknown.
                                  type: string
                                type:
                                  description: Type of condition.
                                  type: string
                              required:
                                - status
                                - type
                              type: object
                            type: array
                          edgeCount:
                            description: EdgeCount is the number of edges in the graph.
                            type: integer
                          lastCommitSHA:
                            description: LastCommitSHA is the commit SHA the KG was last built from.
                            type: string
                          lastUpdated:
                            description: LastUpdated is the last time the KG was updated.
                            format: date-time
                            type: string
                          name:
                            description: Name of the branch.
                            type: string
                          nodeCount:
                            description: NodeCount is the number of nodes in the graph.
                            type: integer
                          observedGeneration:
                            description: |-
                              ObservedGeneration is the 'Generation' of the Service that
                              was last processed by the controller.
                            format: int64
                            type: integer
                        required:
                          - name
                        type: object
                      type: array
                  type: object
              type: object
          required:
            - metadata
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
