apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruns.agent.tekton.dev
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: agents-as-code
spec:
  group: agent.tekton.dev
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    shortNames:
      - ar
    singular: agentrun
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.agent_ref
          name: Agent
          type: string
        - jsonPath: .spec.repository_ref
          name: Repository
          type: string
        - jsonPath: .status.conditions[-1:].type
          name: Status
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            AgentRun is an execution instance spawned when a git event matches an
            Agent definition. Created automatically by the webhook handler, reconciled
            by the AgentRun controller which provisions a sandbox and runs the agent.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                agent_ref:
                  description: AgentRef is the name of the matched Agent definition.
                  type: string
                event:
                  description: Event describes the git event that triggered this run.
                  properties:
                    action:
                      description: Action is the event action (e.g. "opened", "synchronize", "created").
                      type: string
                    branch:
                      description: Branch is the target branch.
                      type: string
                    changed_files:
                      description: ChangedFiles lists files affected by this event.
                      items:
                        type: string
                      type: array
                    comment:
                      description: Comment contains the comment body for comment events.
                      properties:
                        body:
                          description: Body is the comment text.
                          type: string
                      required:
                        - body
                      type: object
                    labels:
                      description: Labels on the issue/PR at event time.
                      items:
                        type: string
                      type: array
                    pull_request:
                      description: PullRequest contains PR-specific details.
                      properties:
                        base_branch:
                          description: BaseBranch is the target branch of the PR.
                          type: string
                        head_branch:
                          description: HeadBranch is the source branch of the PR.
                          type: string
                        number:
                          description: Number is the PR number.
                          type: integer
                        title:
                          description: Title is the PR title.
                          type: string
                      required:
                        - number
                      type: object
                    sender:
                      description: Sender is the user who triggered the event.
                      type: string
                    sha:
                      description: SHA is the commit SHA associated with the event.
                      type: string
                    type:
                      description: Type is the git event type (e.g. "issue_comment", "pull_request", "push").
                      type: string
                    url:
                      description: URL is a deep link to the triggering event (comment, PR, commit).
                      type: string
                  required:
                    - sender
                    - type
                  type: object
                instructions:
                  description: |-
                    Instructions are resolved instruction file references.
                    Repo paths and remote URLs from Agent annotations are resolved at
                    AgentRun creation time.
                  items:
                    properties:
                      content:
                        description: |-
                          Content is the resolved instruction text.
                          Populated at AgentRun creation time by the adapter.
                        type: string
                      name:
                        description: Name is a human-readable identifier for this instruction source.
                        type: string
                      path:
                        description: |-
                          Path is a repo-relative file path.
                          Mutually exclusive with URL.
                        type: string
                      url:
                        description: |-
                          URL is a remote HTTP(S) URL.
                          Mutually exclusive with Path.
                        type: string
                    type: object
                  type: array
                limits:
                  description: |-
                    Limits are the resolved execution constraints.
                    Computed as min(Agent.limits, Repository.settings.ai.max*).
                  properties:
                    max_tokens:
                      description: MaxTokens is the maximum tokens per AgentRun.
                      minimum: 1
                      type: integer
                    timeout_seconds:
                      description: TimeoutSeconds is the maximum execution time.
                      minimum: 1
                      type: integer
                  required:
                    - max_tokens
                    - timeout_seconds
                  type: object
                repository_ref:
                  description: RepositoryRef is the name of the Repository CR in the same namespace.
                  type: string
                system_prompt:
                  description: |-
                    SystemPrompt is the agent's core instructions, copied from the Agent
                    definition at creation time so the reconciler can construct the task
                    without re-fetching agent YAML from the git provider.
                  type: string
                tools:
                  description: |-
                    Tools is the resolved tool configuration, copied from the Agent definition.
                    MCPServer names reference entries in the Repository catalog.
                  properties:
                    allowed:
                      description: |-
                        Allowed is an allowlist of specific tools.
                        Format: "server:tool" or "server:*".
                        If empty, all tools from selected servers are available.
                      items:
                        type: string
                      type: array
                    mcp_servers:
                      description: MCPServers references MCP servers by name from the Repository catalog.
                      items:
                        type: string
                      type: array
                  type: object
              required:
                - agent_ref
                - event
                - limits
                - repository_ref
                - system_prompt
              type: object
            status:
              properties:
                actions:
                  description: Actions records what the agent did for audit.
                  items:
                    properties:
                      sha:
                        description: SHA of the resulting commit, if applicable.
                        type: string
                      type:
                        description: Type of action taken (pr-comment, commit, status-check, create-pr, label).
                        type: string
                      url:
                        description: URL of the resulting resource (e.g. comment URL, PR URL).
                        type: string
                    required:
                      - type
                    type: object
                  type: array
                annotations:
                  additionalProperties:
                    type: string
                  description: |-
                    Annotations is additional Status fields for the Resource to save some
                    additional State as well as convey more information to the user. This is
                    roughly akin to Annotations on any k8s resource, just the reconciler conveying
                    richer information outwards.
                  type: object
                completion_time:
                  description: CompletionTime is when the AgentRun finished.
                  format: date-time
                  type: string
                conditions:
                  description: Conditions the latest available observations of a resource's current state.
                  items:
                    description: |-
                      Condition defines a readiness condition for a Knative resource.
                      See: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#typical-status-properties
                    properties:
                      lastTransitionTime:
                        description: |-
                          LastTransitionTime is the last time the condition transitioned from one status to another.
                          We use VolatileTime in place of metav1.Time to exclude this from creating equality.Semantic
                          differences (all other things held constant).
                        type: string
                      message:
                        description: A human readable message indicating details about the transition.
                        type: string
                      reason:
                        description: The reason for the condition's last transition.
                        type: string
                      severity:
                        description: |-
                          Severity with which to treat failures of this type of condition.
                          When this is not specified, it defaults to Error.
                        type: string
                      status:
                        description: Status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: Type of condition.
                        type: string
                    required:
                      - status
                      - type
                    type: object
                  type: array
                cost_usd:
                  description: CostUSD is the total cost of the run in USD (e.g. "0.42").
                  type: string
                exec_id:
                  description: ExecID is the execution identifier within the sandbox.
                  type: string
                observedGeneration:
                  description: |-
                    ObservedGeneration is the 'Generation' of the Service that
                    was last processed by the controller.
                  format: int64
                  type: integer
                sandbox_name:
                  description: SandboxName tracks which sandbox instance executed this run.
                  type: string
                start_time:
                  description: StartTime is when the AgentRun began executing.
                  format: date-time
                  type: string
                tokens_used:
                  description: TokensUsed is the total LLM tokens consumed during execution.
                  type: integer
              type: object
          required:
            - metadata
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
